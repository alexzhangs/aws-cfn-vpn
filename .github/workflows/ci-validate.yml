name: ci-validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: Lint CloudFormation template
        run: cfn-lint stack.json --ignore-checks W

  lambda-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint Lambda functions
        # Pin the rule set: ruff 0.17 widened its defaults and flags 47 pre-existing
        # style issues; E4/E7/E9/F are the defaults this check was written against.
        run: ruff check lambdas/*.py --select E4,E7,E9,F --ignore E501
